# Legacy: Docker is no longer maintained and may not match the current code.
# Use docs/NATIVE_SETUP.md instead.
services:
  postgres:
    image: postgres:16-alpine
    container_name: awg_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-vpn_bot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vpn_bot_secret}
      POSTGRES_DB: ${POSTGRES_DB:-vpn_bot}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    deploy:
      resources:
        limits:
          cpus: "0.40"
          memory: 256M
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-vpn_bot} -d ${POSTGRES_DB:-vpn_bot}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - internal_net

  migration:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: awg_migration
    command: ["alembic", "upgrade", "head"]
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - internal_net

  bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: awg_bot
    restart: unless-stopped
    command: ["python", "-m", "src.app.bot.main"]
    env_file:
      - .env
    # No vpnctl socket or token here: this container talks to Telegram, so it can't
    # change VPN servers. Subscription screens show no data usage with Docker.
    environment:
      VPNCTL_TOKEN: ""
    deploy:
      resources:
        limits:
          cpus: "0.30"
          memory: 192M
    depends_on:
      postgres:
        condition: service_healthy
      migration:
        condition: service_completed_successfully
    networks:
      - internal_net

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: awg_worker
    restart: unless-stopped
    command: ["python", "-m", "src.app.worker.main"]
    env_file:
      - .env
    # vpnctl on this host (scripts/provisioner/systemd/vpnctl.socket). Other VPN hosts are
    # reached over Tailscale through the Docker host. VPNCTL_GID is the vpn-provisioner
    # group's ID on the host: getent group vpn-provisioner | cut -d: -f3
    volumes:
      - /run/vpnctl:/run/vpnctl
    group_add:
      - "${VPNCTL_GID:-1000}"
    deploy:
      resources:
        limits:
          cpus: "0.30"
          memory: 192M
    depends_on:
      postgres:
        condition: service_healthy
      migration:
        condition: service_completed_successfully
    networks:
      - internal_net

  scheduler:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: awg_scheduler
    restart: unless-stopped
    command: ["python", "-m", "src.app.scheduler.main"]
    env_file:
      - .env
    deploy:
      resources:
        limits:
          cpus: "0.20"
          memory: 128M
    depends_on:
      postgres:
        condition: service_healthy
      migration:
        condition: service_completed_successfully
    networks:
      - internal_net

volumes:
  postgres_data:
    driver: local

networks:
  internal_net:
    driver: bridge
