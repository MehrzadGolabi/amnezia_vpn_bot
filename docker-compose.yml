services:
  postgres:
    image: postgres:16-alpine
    container_name: awg_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-vpn_bot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vpn_bot_secret}
      POSTGRES_DB: ${POSTGRES_DB:-vpn_bot}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    deploy:
      resources:
        limits:
          cpus: "0.40"
          memory: 256M
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-vpn_bot} -d ${POSTGRES_DB:-vpn_bot}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - internal_net

  migration:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: awg_migration
    command: ["alembic", "upgrade", "head"]
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - internal_net

  bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: awg_bot
    restart: unless-stopped
    command: ["python", "-m", "src.app.bot.main"]
    env_file:
      - .env
    deploy:
      resources:
        limits:
          cpus: "0.30"
          memory: 192M
    depends_on:
      postgres:
        condition: service_healthy
      migration:
        condition: service_completed_successfully
    networks:
      - internal_net

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: awg_worker
    restart: unless-stopped
    user: "0:0"
    command: ["python", "-m", "src.app.worker.main"]
    env_file:
      - .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./secrets:/app/secrets:ro
    deploy:
      resources:
        limits:
          cpus: "0.30"
          memory: 192M
    depends_on:
      postgres:
        condition: service_healthy
      migration:
        condition: service_completed_successfully
    networks:
      - internal_net

  scheduler:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: awg_scheduler
    restart: unless-stopped
    command: ["python", "-m", "src.app.scheduler.main"]
    env_file:
      - .env
    deploy:
      resources:
        limits:
          cpus: "0.20"
          memory: 128M
    depends_on:
      postgres:
        condition: service_healthy
      migration:
        condition: service_completed_successfully
    networks:
      - internal_net

volumes:
  postgres_data:
    driver: local

networks:
  internal_net:
    driver: bridge
