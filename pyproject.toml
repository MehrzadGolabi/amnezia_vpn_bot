[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "amneziawg-vpn-bot"
version = "0.1.0"
description = "Production AmneziaWG Telegram Sales and Subscription Bot"
authors = [{ name = "VPN Bot Team" }]
requires-python = ">=3.12"
dependencies = [
    "aiogram>=3.17.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "SQLAlchemy>=2.0.36",
    "asyncpg>=0.30.0",
    "aiosqlite>=0.20.0",
    "alembic>=1.14.0",
    "APScheduler>=3.10.4",
    "paramiko>=3.5.0",
    "structlog>=24.4.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "mypy>=1.13.0",
    "ruff>=0.8.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-p no:launch_testing --strict-markers"

[tool.coverage.run]
source = ["src/app"]
omit = ["tests/*", "src/app/db/migrations/*"]

[tool.coverage.report]
fail_under = 80
show_missing = true
