# Installed to /etc/ssh/sshd_config.d/vpn-provisioner.conf by install-provisioner.sh.
# Whatever key logs in as vpn-provisioner can only run vpnctl through vpnctl-ssh.
Match User vpn-provisioner
    ForceCommand /usr/local/sbin/vpnctl-ssh
    PasswordAuthentication no
    KbdInteractiveAuthentication no
    AllowTcpForwarding no
    AllowStreamLocalForwarding no
    AllowAgentForwarding no
    X11Forwarding no
    PermitTunnel no
    PermitTTY no
    PermitUserRC no
